<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <!-- Connect our HTML file to the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-container">

        <!-- Page heading -->
        <header class="todo-header">
            <h1>My To-Do List</h1>
            <p>Organize your tasks and get things done.</p>
        </header>

        <!-- Task input section -->
        <section class="task-input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                maxlength="100"
                aria-label="Enter a new task"
            >

            <button id="addTaskButton">
                Add Task
            </button>

        </section>

        <!-- Task statistics -->
        <section class="task-stats">

            <div class="stat">
                <span id="totalTasks">0</span>
                <small>Total</small>
            </div>

            <div class="stat">
                <span id="completedTasks">0</span>
                <small>Completed</small>
            </div>

            <div class="stat">
                <span id="remainingTasks">0</span>
                <small>Remaining</small>
            </div>

        </section>

        <!-- Task list -->
        <section class="tasks-section">

            <!-- JavaScript will place tasks inside this element -->
            <ul id="taskList"></ul>

            <!-- Displayed when there are no tasks -->
            <p id="emptyState" class="empty-state">
                You don't have any tasks yet. Add one above!
            </p>

        </section>

        <!-- Clear completed button -->
        <div class="actions">
            <button id="clearCompletedButton" class="clear-button">
                Clear Completed
            </button>
        </div>

    </main>

    <!-- Connect our HTML file to the JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
